<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atendimento</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14110f">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tool.css">
</head>
<body class="cust">
<main class="chat" id="chat" aria-label="Atendimento automático">
  <header>
    <span class="av" id="av" aria-hidden="true">·</span>
    <div><b id="biz">Carregando…</b><span>assistente automático · sem IA</span></div>
    <a class="btn mini wa hide" id="wa-top" target="_blank" rel="noopener">WhatsApp</a>
  </header>
  <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversa"></div>
  <div class="chips" id="chips" aria-label="Sugestões de perguntas"></div>
  <form id="form" autocomplete="off">
    <label class="sr" for="msg">Sua mensagem</label>
    <input id="msg" type="text" placeholder="Escreva sua mensagem…" maxlength="200" enterkeyhint="send" disabled>
    <button class="btn" type="submit" disabled>Enviar</button>
  </form>
  <p class="foot" id="foot">Respostas automáticas, feitas no seu aparelho: nada da conversa é enviado a servidor. Para falar com uma pessoa, use o botão do WhatsApp.<br>Feito com <a href="index.html" id="made">freguesbot</a>, código aberto.</p>
</main>
<script id="embed"></script>
<script src="kit.js"></script>
<script src="bot.js"></script>
<script src="chat.js"></script>
<script src="atender.js"></script>
</body>
</html>
